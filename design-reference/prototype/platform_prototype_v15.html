function auditLog(action,record,before,after){S.audit.unshift({actor:'TEST · '+(roleLabel()||'المستخدم'),action,record,before:String(before??'—'),after:String(after??'—'),date:S.date})}

/* ===== التواريخ والتقارير ===== */
function dueForPeriod(p){const [y,m]=p.split('-').map(Number);return new Date(Date.UTC(y,m,5)).toISOString().slice(0,10)}
function previousPeriod(date){const [y,m]=date.slice(0,7).split('-').map(Number);return m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`}
function nextPeriod(p){const [y,m]=p.split('-').map(Number);return m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`}
const isEditable=x=>['مسودة','معاد للتعديل'].includes(x.status);
const isApproved=x=>['مقفل','معتمد'].includes(x.status);
const approvedReports=co=>S.reports.filter(x=>x.co===co&&isApproved(x)).sort((a,b)=>b.period.localeCompare(a.period));
const expectedReport=co=>S.reports.find(x=>x.co===co&&x.period===previousPeriod(S.date));
function isLate(co){const r=expectedReport(co);return S.date>dueForPeriod(previousPeriod(S.date))&&(!r||isEditable(r))}
function visibleReports(){const r=role();return S.reports.filter(x=>r==='owner'||r==='bd'?isApproved(x):r==='manager'?x.co===companyForRole():r==='accountant'?x.status!=='مسودة':false).sort((a,b)=>b.period.localeCompare(a.period)||a.co.localeCompare(b.co))}
function workStatus(s){return({'جديد':'جديد','قيد الدراسة':'جديد','قيد التنفيذ':'قيد العمل','قيد العمل':'قيد العمل','بانتظار اعتماد المالك':'بانتظار رد','بانتظار قرار المالك':'بانتظار رد','بانتظار رد':'بانتظار رد','معاد للتعديل':'قيد العمل','مقفل':'مكتمل','معتمد':'مكتمل','مكتمل':'مكتمل','منفذ':'مكتمل','مرفوض':'مغلق','مغلق':'مغلق'})[s]||s}
function routeRequest(type){return({'محاسبة':'المحاسب','تصميم':'المصمم','دراسة':'مطور الأعمال','مساعدة':'مطور الأعمال'})[type]||'مطور الأعمال'}
function companyForRole(){if(role()!=='manager')return null;return S.currentCompany||S.users.find(u=>u.role==='مدير الشركة'&&u.company&&u.company!=='HOLD')?.company||S.companies[0]?.id}
function planPeriod(co){const done=S.createdTasks.filter(x=>x.kind==='plan'&&x.company===co&&x.status==='مكتمل').sort((a,b)=>b.period.localeCompare(a.period))[0];return done?nextPeriod(done.period):previousPeriod(S.date)}
function activePlan(co){return S.createdTasks.find(x=>x.kind==='plan'&&x.company===co&&x.period===planPeriod(co)&&x.status!=='مكتمل')}
function overdueDirectives(){return S.decisions.filter(x=>x.kind==='توجيه'&&x.followup&&S.date>x.followup&&!['منفذ','مكتمل'].includes(x.status))}

/* ===== تعريف حقول الاستمارة ===== */
function fieldApplies(f,co){const c=companyInfo(co);return f.scope==='company'?f.company===co:f.sector===c?.sector}
function effectiveFields(co,activeOnly=true){return S.forms.filter(f=>(!activeOnly||f.active)&&fieldApplies(f,co)).sort((a,b)=>(a.order||0)-(b.order||0))}
function getFormSnapshot(co){return effectiveFields(co).map(f=>({id:f.id,name:f.name,type:f.type,required:f.required,parent:f.parent||'',options:f.options||[],showOnDashboard:!!f.showOnDashboard}))}
function snapshotDefs(report,co){return report?.formSnapshot||getFormSnapshot(co)}
function childDefs(parent,defs){return defs.filter(f=>f.parent===parent)}
function anchorCompany(f){return f.scope==='company'?f.company:S.companies.find(c=>c.sector===f.sector)?.id}
function nameTaken(name,parent,scope,anchor,ignoreId){const c=companyInfo(anchor);if(!c)return false;const targets=scope==='company'?[c]:S.companies.filter(x=>x.sector===c.sector);return targets.some(x=>effectiveFields(x.id).some(f=>f.id!==ignoreId&&(f.parent||'')===(parent||'')&&f.name.trim().toLowerCase()===name.trim().toLowerCase()))}
function parentOptions(scope,type,company){const c=companyInfo(company);if(!['amount','number'].includes(type)||!c)return[];return[...systemFields.filter(s=>s.type===type),...S.forms.filter(f=>f.active&&!f.parent&&f.type===type&&f.scope===scope&&(scope==='company'?f.company===company:f.sector===c.sector))]}
function normalize(){S.dismissedAlerts=S.dismissedAlerts||{};S.forms.forEach((f,i)=>{if(f.order===undefined)f.order=i;if(!f.options)f.options=[]});S.reports.forEach(r=>{if(!r.formSnapshot)r.formSnapshot=getFormSnapshot(r.co)})}

/* ===== حقول التقرير ===== */
function priorReport(report){return S.reports.filter(x=>x.co===report.co&&x.period<report.period&&isApproved(x)).sort((a,b)=>b.period.localeCompare(a.period))[0]}
function coreValue(report,id){const s=sysById(id);return s?report?.[s.core]:report?.values?.[id]}
function priorValue(report,id){if(!report)return'';const p=priorReport(report);if(!p)return'';return coreValue(p,id)??''}
function refText(prev,val){return prev===''||prev==null?'':`السابق ${esc(prev)}${String(prev)===String(val??'')?' · لم يتغير':''}`}
function extraField(f,report){
  const val=report?.values?.[f.id]??'',cur=companyInfo(report?.co)?.currency||'',numeric=f.type==='amount'||f.type==='number',prev=numeric?priorValue(report,f.id):'',req=f.required?'required':'';
  let control;
  if(f.type==='list')control=`<select name="field_${f.id}" ${req}><option value="">اختر</option>${(f.options||[]).map(v=>`<option ${String(val)===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
  else{const type=numeric?'number':f.type==='date'?'date':'text';control=`<input name="field_${f.id}" type="${type}" ${numeric?'step="any"':''} value="${esc(val)}" ${numeric?`data-prev-value="${esc(prev)}"`:''} ${req}>`}
  return `<label class="field ${f.parent?'subfield':''}">${f.parent?'↳ ':''}${esc(f.name)}${f.required?' *':''}${f.type==='amount'?` (${esc(cur)})`:''}${control}${numeric?`<small class="muted" data-ref-for="field_${f.id}">${refText(prev,val)}</small>`:''}</label>`}
function childrenBlock(pid,report,defs){const ch=childDefs(pid,defs);const remaining=ch.some(c=>c.type==='amount'||c.type==='number')?`<small class="muted" data-remaining="${pid}"></small>`:'';return ch.map(c=>extraField(c,report)).join('')+remaining}
function formFields(co,report){const defs=snapshotDefs(report,co);return defs.filter(f=>!f.parent).map(f=>extraField(f,report)+childrenBlock(f.id,report,defs)).join('')}
function coreBlock(sys,report){const val=report?.[sys.core]??'',prev=priorValue(report,sys.id),cur=companyInfo(report.co)?.currency||'',defs=snapshotDefs(report,report.co);return `<div class="field">${t(sys.core)} (${esc(cur)}) *<input name="${sys.core}" type="number" step="any" min="0" value="${esc(val)}" data-prev-value="${esc(prev)}" required><small class="muted" data-ref-for="${sys.core}">${refText(prev,val)}</small>${childrenBlock(sys.id,report,defs)}</div>`}
function reportContext(form){const rid=form.elements.reportId?.value;const x=rid?S.reports.find(r=>r.id===rid):null;return{x,co:x?x.co:companyForRole()}}
function parentFormName(p){return p.core||`field_${p.id}`}
function updateRemainders(form){
  if(!form)return;const{x,co}=reportContext(form),defs=snapshotDefs(x,co),cur=companyInfo(co)?.currency||'';
  form.querySelectorAll('[data-prev-value]').forEach(inp=>{const ref=form.querySelector(`[data-ref-for="${inp.name}"]`);if(!ref)return;const prev=inp.dataset.prevValue;ref.textContent=prev===''?'':'السابق '+prev+(String(inp.value)===String(prev)?' · لم يتغير':' · تغيّر')});
  [...systemFields,...defs.filter(f=>!f.parent)].forEach(p=>{const ch=childDefs(p.id,defs).filter(c=>c.type==='amount'||c.type==='number');if(!ch.length)return;const total=Number(form.elements[parentFormName(p)]?.value||0),sum=ch.reduce((n,c)=>n+Number(form.elements[`field_${c.id}`]?.value||0),0),el=form.querySelector(`[data-remaining="${p.id}"]`);if(el)el.textContent=`غير موزع: ${fmtNum(Math.max(0,total-sum))} ${p.type==='amount'?cur:''} (الباقي ضمن أخرى)`+(sum>total?' · تنبيه: مجموع الفروع يتجاوز الرئيسي':'')})}
function validateChildren(form,co,report){
  const defs=snapshotDefs(report,co),errors=[];
  for(const p of [...systemFields,...defs.filter(f=>!f.parent)]){const ch=childDefs(p.id,defs).filter(c=>c.type==='amount'||c.type==='number');if(!ch.length)continue;const total=Number(form.elements[parentFormName(p)]?.value||0),sum=ch.reduce((n,c)=>n+Number(form.elements[`field_${c.id}`]?.value||0),0);if(sum>total)errors.push(`${p.name}: مجموع الفروع ${fmtNum(sum)} يتجاوز الرئيسي ${fmtNum(total)}`)}
  if(errors.length){alert(errors.join('\n'));return false}return true}
function captureFormValues(form,defs){const values={};for(const f of defs){const v=form.elements[`field_${f.id}`]?.value;if(v!==undefined&&v!=='')values[f.id]=v}return values}
function unchangedList(form,defs){const out=[],labels={revenue:t('revenue'),expenses:t('expenses'),receivables:t('receivables')};form.querySelectorAll('[data-prev-value]').forEach(inp=>{const p=inp.dataset.prevValue;if(p!==''&&inp.value!==''&&String(inp.value)===String(p))out.push(labels[inp.name]||defs.find(f=>'field_'+f.id===inp.name)?.name||inp.name)});return out}
function reportValues(x){const o={[t('revenue')]:x.revenue,[t('expenses')]:x.expenses,[t('receivables')]:x.receivables,[t('bankBalance')]:x.bankBalance};snapshotDefs(x,x.co).forEach(f=>{o[f.name]=x.values?.[f.id]});return o}
function diffText(a,b){const keys=[...new Set([...Object.keys(a),...Object.keys(b)])].filter(k=>String(a[k]??'')!==String(b[k]??''));return keys.length?[keys.map(k=>`${k}: ${a[k]??'—'}`).join('؛ '),keys.map(k=>`${k}: ${b[k]??'—'}`).join('؛ ')]:null}
function snapshotView(x){
  const defs=snapshotDefs(x,x.co),cur=companyInfo(x.co)?.currency||'',rows=[];
  const show=(f,v)=>v===undefined||v===null||v===''?'—':f.type==='amount'?fmtNum(v)+' '+cur:esc(v);
  const kids=pid=>childDefs(pid,defs).forEach(c=>rows.push(`<tr class="sub"><td>↳ ${esc(c.name)}</td><td>${show(c,x.values?.[c.id])}</td></tr>`));
  systemFields.forEach(s=>{rows.push(`<tr><td><b>${esc(s.name)}</b></td><td>${show(s,x[s.core])}</td></tr>`);kids(s.id)});
  rows.push(`<tr><td><b>${t('bankBalance')}</b></td><td>${show({type:'amount'},x.bankBalance)}</td></tr>`);
  defs.filter(f=>!f.parent).forEach(f=>{rows.push(`<tr><td><b>${esc(f.name)}</b></td><td>${show(f,x.values?.[f.id])}</td></tr>`);kids(f.id)});
  return `<div class="tablewrap compact"><table><tbody>${rows.join('')}</tbody></table></div>`}
function readOnlyReport(x){return `<section class="card panel"><h2>عرض تقرير ${esc(cName(x.co))} · ${esc(x.period)}</h2><p><span class="pill">${esc(workStatus(x.status))}</span> · ${t('due')}: ${esc(x.due)} · ${t('bank')}: ${esc(x.bank||'—')}</p>${x.note&&x.status==='معاد للتعديل'?`<p class="muted">${t('note')}: ${esc(x.note)}</p>`:''}${snapshotView(x)}<div class="actions">${button('إغلاق','cancelReport')}</div></section>`}
function newReportDraft(){const co=companyForRole(),d={id:'',co,period:previousPeriod(S.date),status:'جديد',revenue:null,expenses:null,receivables:null,bankBalance:null,bank:'',values:{},formSnapshot:getFormSnapshot(co)};const p=priorReport(d);if(p){systemFields.forEach(s=>{d[s.core]=p[s.core]});d.values=Object.assign({},p.values||{})}return d}
function renderReportForm(x){
  const isNew=!x.id,editable=role()==='manager'&&(isNew||isEditable(x));
  if(!editable)return readOnlyReport(x);
  const cur=companyInfo(x.co)?.currency||'',note=x.status==='معاد للتعديل'&&x.note?`<div class="alert"><span><b>${t('note')}:</b> ${esc(x.note)}</span></div>`:'';
  return `<form class="card panel" id="reportForm"><input type="hidden" name="reportId" value="${esc(x.id)}"><h2>${isNew?'إنشاء تقرير شهري':'استمارة'} · ${esc(cName(x.co))}${isNew?'':' · '+esc(x.period)} <span class="tagtest">TEST</span></h2>${note}<div class="formgrid">${isNew?`<label class="field">${t('period')}<input name="period" type="month" value="${esc(x.period)}" max="${previousPeriod(S.date)}" required></label>`:''}${systemFields.map(s=>coreBlock(s,x)).join('')}<label class="field">${t('bankBalance')} (${esc(cur)}) *<input name="bankBalance" type="number" step="any" value="${esc(x.bankBalance??'')}" required></label>${formFields(x.co,x)}<label class="field">${t('bank')}<input name="bank" type="file" accept=".pdf,.png,.jpg,.jpeg"><small class="muted">${esc(x.bank||'')}</small></label></div><p class="muted">${t('filledPrev')} ${t('fileNote')}</p><label class="fieldrow"><input type="checkbox" name="declaration"> أقر بصحة البيانات المدخلة.</label><div class="actions"><button type="button" class="btn" data-act="saveReport">${isNew?'حفظ كمسودة':t('save')}</button><button class="btn primary">${t('send')}</button>${!isNew&&x.status==='مسودة'?button('تحديث الحقول من التعريف الحالي','updateFields:'+x.id):''}${button('إغلاق','cancelReport')}</div></form>`}
function fileName(form,name){const el=form.elements[name];return el&&el.files&&el.files[0]?'TEST_'+el.files[0].name.replace(/^TEST_/,''):''}
function formObj(form){return Object.fromEntries(new FormData(form).entries())}
function saveReport(f,mode){
  const d=formObj(f),isNew=!d.reportId,co=companyForRole();
  if(role()!=='manager'||!co)return;
  let x=isNew?S.reports.find(q=>q.co===co&&q.period===d.period):S.reports.find(q=>q.id===d.reportId);
  if(isNew&&x){alert('يوجد تقرير لهذه الفترة؛ افتحه من القائمة.');return}
  if(x&&(x.co!==co||!isEditable(x))){alert('هذا التقرير مرسل أو مقفل أو خارج صلاحيتك، ولا يمكن تعديله.');return}
  const period=isNew?d.period:x.period;if(!period){alert('اختر الفترة.');return}
  const defs=snapshotDefs(x,co);
  if(mode==='submit'){
    if(!(x?.bank||fileName(f,'bank'))){alert('أرفق كشف الحساب البنكي قبل الإرسال.');return}
    if(!f.elements.declaration.checked){alert('أقر بصحة البيانات المدخلة قبل الإرسال.');return}
    if(!validateChildren(f,co,x))return;
    const same=unchangedList(f,defs);if(same.length&&!confirm('هذه الحقول لم تتغير عن الشهر السابق: '+same.join('، ')+'\nهل تؤكد صحتها؟'))return}
  let created=false;
  if(!x){x={id:nextId('RPT-TEST-',S.reports),co,period,due:dueForPeriod(period),status:'مسودة',revenue:null,expenses:null,receivables:null,bankBalance:null,bank:'',note:'',values:{},formSnapshot:getFormSnapshot(co)};S.reports.unshift(x);created=true}
  const before=reportValues(x);
  x.revenue=num(d.revenue);x.expenses=num(d.expenses);x.receivables=num(d.receivables);x.bankBalance=num(d.bankBalance);x.values=captureFormValues(f,snapshotDefs(x,co));
  const fn=fileName(f,'bank');if(fn)x.bank=fn;
  const diff=diffText(before,reportValues(x));if(diff&&!created)auditLog('تعديل قيم التقرير',x.id,diff[0],diff[1]);
  if(mode==='submit'){const old=x.status;x.status='مرسل للمحاسبة';x.note='';auditLog(old==='معاد للتعديل'?'إعادة إرسال تقرير':'إرسال تقرير للمحاسبة',x.id,created?'جديد':old,'مرسل للمحاسبة · '+x.period)}
  else if(created)auditLog('إنشاء تقرير (مسودة)',x.id,'—','مسودة · '+x.period);
  S.activeReport=null;S.reportDraft=false;persist();notify(mode==='submit'?'أُرسل التقرير للمحاسبة بنجاح.':created?'حُفظ التقرير كمسودة.':t('saved'))}

/* ===== التنبيهات والذكاء الاصطناعي التوضيحي ===== */
function alertsForRole(){
  const r=role(),co=companyForRole();let n=0,label='';
  if(r==='manager'){n=(isLate(co)?1:0)+S.requests.filter(x=>x.company===co&&x.status==='بانتظار رد'&&x.assigned!=='مدير الشركة').length;label='استمارة متأخرة أو طلب ينتظر ردك'}
  else if(r==='accountant'){n=S.reports.filter(x=>x.status==='مرسل للمحاسبة').length;label='تقارير بانتظار المراجعة'}
  else if(r==='owner'){n=S.decisions.filter(x=>x.status==='بانتظار اعتماد المالك').length+overdueDirectives().length;label='قرارات أو توجيهات تحتاج متابعة'}
  else if(r==='bd'){n=S.createdTasks.filter(x=>x.assigned==='مطور الأعمال'&&x.status!=='مكتمل').length+S.requests.filter(x=>x.assigned==='مطور الأعمال'&&workStatus(x.status)!=='مكتمل').length+S.decisions.filter(x=>x.kind==='توجيه'&&x.recipient==='مطور الأعمال'&&x.status!=='منفذ').length;label='مهام وطلبات وتوجيهات بانتظار العمل'}
  else if(r==='designer'){n=S.requests.filter(x=>x.assigned==='المصمم'&&workStatus(x.status)!=='مكتمل').length;label='طلبات تصميم مسندة إليك'}
  else if(r==='marketing'){n=S.leads.filter(x=>x.status==='جديد').length;label='عملاء محتملون يحتاجون متابعة'}
  else if(r==='advisor'){n=S.decisions.filter(x=>x.kind==='توجيه'&&x.recipient==='المستشار'&&x.status!=='منفذ').length;label='توجيهات موجهة إليك'}
  return{n,label,key:r+':'+label+':'+n}}
function aiSummary(companies){
  return companies.map(c=>{const rs=approvedReports(c.id),cur=rs[0],prev=rs[1];if(!cur)return `${esc(c.ar)}: لا توجد بيانات معتمدة تكفي للتحليل.`;
    const parts=[];if(prev&&prev.revenue){const pct=(cur.revenue-prev.revenue)/prev.revenue*100;parts.push(`الإيراد ${pct>=0?'ارتفع':'انخفض'} ${Math.abs(pct).toFixed(1)}% عن ${esc(prev.period)}`)}else parts.push('لا تتوفر فترة سابقة للمقارنة');
    if(prev){const d=Number(cur.bankBalance||0)-Number(prev.bankBalance||0);parts.push(`رصيد البنك ${d>=0?'زاد':'انخفض'} بمقدار ${fmtNum(Math.abs(d))} ${esc(c.currency)}`)}
    return `${esc(c.ar)} (${esc(c.currency)}) — ${parts.join('؛ ')}. الفترة ${esc(cur.period)}، المصدر: التقرير ${esc(cur.id)}.`}).join('<br>')}

/* ===== الأدوار والصفحات ===== */
function roleTabs(){const r=role();
  if(r==='owner')return['dashboard','leads','requests','advisory','opportunities','decisions','reports','employees','hr','assets','site','aiReview'];
  if(r==='manager')return['dashboard','reports','employees','hr','leads','requests'];
  if(r==='accountant')return['dashboard','reports','requests'];
  if(r==='bd')return['dashboard','opportunities','site','requests','advisory','employees','hr','reports'];
  if(r==='marketing')return['dashboard','leads','requests'];
  if(r==='designer')return['dashboard','requests'];
  if(r==='advisor')return['dashboard','advisory','requests'];
  return['dashboard']}
function canOpen(tab){if(tab==='group'||tab==='ownerReports'||tab==='execSummary')return role()==='owner';return roleTabs().includes(tab)}
function openTab(tab){S.tab=canOpen(tab)?tab:'dashboard';S.activeReport=null;S.activeRequest=null;S.reportDraft=false;S.requestDraft=false;persist();render()}
function switchRole(r){S.role=r;if(r==='manager'){const u=S.users.find(x=>x.email===S.currentManagerEmail&&x.role==='مدير الشركة')||S.users.find(x=>x.role==='مدير الشركة'&&x.company&&x.company!=='HOLD');S.currentCompany=u?.company||S.companies[0]?.id;S.currentManagerEmail=u?.email||''}S.tab='dashboard';S.activeReport=null;S.activeRequest=null;S.reportDraft=false;S.requestDraft=false;persist();render()}
function button(txt,act,primary=false){return `<button type="button" class="btn ${primary?'primary':''}" data-act="${act}">${txt}</button>`}
function smallBtn(txt,act){return `<button type="button" class="btn small" data-act="${act}">${txt}</button>`}
function table(headers,rows){if(!rows.length)return `<div class="empty">${t('noData')}</div>`;return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${t(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}

function companyCard(c){
  const rs=approvedReports(c.id),x=rs[0],prev=rs[1],late=isLate(c.id),returned=expectedReport(c.id)?.status==='معاد للتعديل';
  const net=x?(x.revenue||0)-(x.expenses||0):0,declined=!!(x&&prev&&prev.revenue&&x.revenue<prev.revenue*.9);
  let color='green',reason='';
  if(late){color='red';reason='تقرير الفترة المتوقعة متأخر'}
  else if(x&&net<0){color='red';reason='صافي ربح سالب'}
  else if(x&&x.bankBalance<0){color='red';reason='رصيد بنك سالب'}
  else if(!x){color='gray';reason='لا بيانات معتمدة'}
  else if(declined){color='yellow';reason='تراجع الإيراد 10% فأكثر'}

function submitRequestDetail(f){
  const d=formObj(f),x=S.requests.find(q=>q.id===d.requestId);if(!x)return;
  const me=roleLabel(),isAssignee=x.assigned===me,isSender=role()==='manager'&&x.company===companyForRole();
  if(!(role()==='owner'||isAssignee||isSender))return;
  const msg=(d.message||'').trim(),oldStatus=workStatus(x.status),lastReply=x.replies?.at(-1)?.text||'';
  let status=oldStatus;
  if(isAssignee&&d.status)status=d.status;else if(isSender&&oldStatus==='بانتظار رد'&&msg)status='قيد العمل';
  if(status==='مكتمل'&&oldStatus!=='مكتمل'&&!msg){alert('اكتب ملاحظة الإنجاز قبل إكمال الطلب.');return}
  if(!msg&&status===oldStatus){alert('اكتب ردًا أو غيّر الحالة.');return}
  x.replies=x.replies||[];if(msg)x.replies.push({from:me,text:msg,date:S.date});x.status=status;
  auditLog('رد أو تحديث طلب',x.id,oldStatus+' · '+(lastReply||'—'),status+' · '+(msg||'—'));S.activeRequest=null;persist();notify('تم حفظ الرد والحالة.')}

{id:'KB-12',title:'من يرى ماذا',kw:['صلاحيات','صلاحيه','يرى','اشوف','نسبه الملكيه','يشوف','خصوصيه'],text:'المالك ومطور الأعمال يريان التقارير المعتمدة فقط. نسب الملكية وحصة الأرباح للمالك وحده.\nمدير الشركة يرى شركته فقط. المحاسب يرى التقارير المرسلة والمعتمدة. المسوق والمصمم يريان أعمالهما فقط.'},
{id:'KB-13',title:'المشاريع المستقبلية',kw:['مشروع','مشاريع','مستقبليه','مستقبل','فكره'],text:'في النموذج الحالي تُتابَع المشاريع المستقبلية كفرص استثمارية أو كتكليف دراسة لمطور الأعمال حتى يقرر المالك. لا توجد لها وحدة مستقلة بعد.'},

{id:'KB-14',title:'سجل التدقيق',kw:['تدقيق','سجل','تتبع','تغييرات'],text:'كل تغيير مهم (اعتماد، إعادة، فتح، موافقة إجازة، تعديل حقل) يُسجَّل بالمنفذ والتاريخ وقبل/بعد.'}
];
const ROLE_HINT={owner:'دورك: تعتمد القرارات وتصدر التوجيهات وتدير الحقول، وتوافق على إعادة فتح التقارير المقفلة.',manager:'دورك: تنشئ تقرير شركتك الشهري وترسله للمحاسبة قبل يوم 5، وترفع الطلبات وتسجل الموظفين والإجازات.',accountant:'دورك: تراجع التقارير المرسلة فتعيدها بملاحظة أو تعتمدها وتقفلها، ويمكنك طلب إعادة فتح مقفل.',bd:'دورك: تسجل الفرص والدراسات، وتنفذ المهام المسندة، وتراجع إجازات موظفي التابعة.',marketing:'دورك: تسجل العملاء المحتملين وتحدّث مراحلهم.',designer:'دورك: تنفذ طلبات التصميم المسندة إليك.'};
const CHIPS={owner:['أي شركة متأخرة؟','ما وضع الإيرادات؟','ما قيمة الأصول؟','ما الذي يحتاج قراري؟','كيف يُعاد فتح تقرير مقفل؟'],manager:['ما حالة تقريري؟','كيف أرسل التقرير؟','متى موعد الإرسال؟','كيف أرفع طلب خدمة؟'],accountant:['ما التقارير بانتظاري؟','متى أعيد التقرير للمدير؟','كيف أطلب إعادة فتح تقرير؟'],bd:['ما مهامي الآن؟','ما الفرص المسجلة؟','كيف أراجع الإجازات؟'],marketing:['ما العملاء الجدد؟','ما مراحل العميل المحتمل؟'],designer:['ما طلباتي؟','كيف تصلني الطلبات؟']};
const SCOPE_KW=['قابض','شرك','تابع','مشروع','مشاريع','استثمار','فرص','تقرير','طلب','توجيه','عميل','عملاء','اجاز','ايراد','مصروف','محاسب','مدير','مطور','مسوق','مصمم','مستشار','اعتماد','ميزاني','مستحقات','رصيد','سير','عمل','منصه','حقل','حقول','تاخر','متاخر','مهام','مهمه','مهامي','ارباح','ربح','ملكي','راتب','رواتب','قرار','موظف','دراسه','خطه','لوحه','صلاحي','مرحله','مراحل','تقارير','بانتظار','قرارات','فرصه','اصول','ذهب','عقار','موقع','نشر'].map(nz);

function ai(){S.ai=S.ai||{};const a=S.ai;a.chats=a.chats||{};a.queue=a.queue||[];a.learned=a.learned||[];a.cardHidden=a.cardHidden||{};a.cardOff=a.cardOff||{};a.feedback=a.feedback||[];a.usage=a.usage||{};a.seq=a.seq||0;return a}
const AI_ON=()=>!!S.role&&S.role!=='advisor';
const chatKey=()=>role()+(role()==='manager'?':'+companyForRole():'');
const kbAll=()=>BASE_KB.concat(ai().learned.map(x=>({id:x.id,title:x.title,kw:x.kw,text:x.text,learned:true,src:x.src})));
const canFin=()=>['owner','manager','accountant','bd'].includes(role());
const visCos=()=>role()==='manager'?S.companies.filter(c=>c.id===companyForRole()):S.companies;
function mentioned(q){return S.companies.filter(c=>{const w=nz(c.ar.split(' ')[0]),e=c.en.split(' ')[0].toLowerCase();return q.includes(w)||q.includes(e)})}
function kbBest(q){let best=null,score=0;for(const e of kbAll()){let s=0;for(const k of e.kw){const kk=nz(k);if(kk&&q.includes(kk))s+=kk.includes(' ')?2:1}if(s>score){score=s;best=e}}return score>0?best:null}
function kbReply(e){return{html:br(e.text)+(ROLE_HINT[role()]?'<br><br><b>'+esc(ROLE_HINT[role()])+'</b>':''),src:['دليل سير العمل · '+e.title+(e.learned?' ('+e.src+')':'')]}}
const refuse=(m)=>({html:esc(m),src:['حدود الصلاحية']});

function answer(raw){
  const q=nz(raw),r=role();
  if(/راتب|رواتب|اجور|مرتب/.test(q))return refuse('لا أعرض الرواتب ولا ملفات الموظفين لأي دور. تبقى في صفحة ملفات الموظفين لمن له صلاحيتها.');
  if(/ملكي|حصه المجموعه|حصه من الربح|حصه الارباح|نسبه المجموعه/.test(q)){
    if(r!=='owner')return refuse('نسب الملكية وحصة الأرباح للمالك فقط.');
    return{html:S.companies.map(c=>esc(c.ar)+': '+esc(c.ownership)+'%').join('<br>'),src:['بيانات الشركات (المالك فقط)']}}
  const co=mentioned(q),inScope=co.length||SCOPE_KW.some(k=>q.includes(k))||kbBest(q);
  if(!inScope)return{html:'أنا مخصص لشؤون القابضة والشركات التابعة والمشاريع المستقبلية والفرص الاستثمارية فقط، ولا أجيب عن هذا الموضوع. جرّب أحد الأسئلة المقترحة أسفل الشاشة.',src:['حدود النطاق'],out:true};
  {const L=ai().learned.map(e=>({e,s:e.kw.filter(k=>q.includes(nz(k))).length,n:Math.min(2,e.kw.length)})).filter(x=>x.s>=x.n).sort((a,b)=>b.s-a.s)[0];if(L)return{html:br(L.e.text),src:['معرفة معتمدة · '+L.e.src]}}
  if(/كيف|لماذا|اشرح|شرح|من يعتمد|من يراجع|من يوافق|متي|ما معني|ما الفرق|خطوات|طريقه|مراحل|مرحله|الوان|لون|صلاحيات|من يري/.test(q)){const e=kbBest(q);if(e)return kbReply(e)}
  if(/اصول|ذهب|عقار|اسهم|(^| )(ال)?اصل( |$)/.test(q)){
    if(r!=='owner')return refuse('أصول القابضة متاحة للمالك فقط.');
    const t=assetTotals();return{html:br(t.rows.join('\n')||'لا أصول نشطة مسجلة.'),src:['سجل أصول القابضة (المالك فقط)']}}
  if(/بانتظار|مهامي|طلباتي|اعمل|افعل|الان|قراري|مطلوب|يحتاج قرار|مهام/.test(q)){
    const a=alertsForRole(),lines=[];
    if(r==='owner'){lines.push(S.decisions.filter(x=>x.status==='بانتظار اعتماد المالك').length+' قرارات بانتظار اعتمادك',overdueDirectives().length+' توجيهات متأخرة',S.reports.filter(x=>x.reopenReq).length+' طلبات إعادة فتح تقرير بانتظارك')}
    else if(r==='manager'){const ex=expectedReport(companyForRole());lines.push('تقرير '+previousPeriod(S.date)+': '+(ex?workStatus(ex.status)+' ('+ex.status+')':'لم يُنشأ بعد'),S.requests.filter(x=>x.company===companyForRole()&&x.status==='بانتظار رد'&&x.assigned!=='مدير الشركة').length+' طلبات تنتظر ردك')}
    else if(r==='accountant'){const p=S.reports.filter(x=>x.status==='مرسل للمحاسبة');lines.push(p.length+' تقارير بانتظار مراجعتك'+(p.length?': '+p.map(x=>x.id).join('، '):''))}
    else if(r==='bd'){lines.push((S.createdTasks.filter(x=>x.assigned==='مطور الأعمال'&&x.status!=='مكتمل').length+S.requests.filter(x=>x.assigned==='مطور الأعمال'&&workStatus(x.status)!=='مكتمل').length)+' مهام وطلبات مفتوحة',S.hr.filter(h=>h.type.includes('إجازة')&&h.status==='بانتظار المراجعة').length+' إجازات بانتظار مراجعتك')}
    else if(r==='marketing')lines.push(S.leads.filter(x=>x.status==='جديد').length+' عملاء جدد يحتاجون متابعة');
    else if(r==='designer')lines.push(S.requests.filter(x=>x.assigned==='المصمم'&&workStatus(x.status)!=='مكتمل').length+' طلبات تصميم مفتوحة');
    return{html:br(lines.join('\n')),src:['صندوق العمل · '+roleLabel()]}}
  const finance=/ايراد|مصروف|رصيد|مستحقات|ربح|دخل|اداء|تقرير|وضع/.test(q);
  if(/متاخر|تاخر/.test(q)){
    if(!canFin())return refuse('حالة التقارير غير متاحة لدورك.');
    const late=visCos().filter(c=>isLate(c.id));
    return{html:late.length?esc('متأخرة عن موعد تقرير '+previousPeriod(S.date)+': '+late.map(c=>c.ar).join('، ')):esc('لا توجد شركة متأخرة حاليًا في '+(r==='manager'?'شركتك':'المجموعة')+'.'),src:['حالة التقارير · التاريخ '+S.date]}}
  if(/حاله/.test(q)&&/تقرير|تقارير/.test(q)){
    if(!canFin())return refuse('التقارير غير متاحة لدورك.');
    if(r==='manager'&&co.some(c=>c.id!==companyForRole()))return refuse('تستطيع الاطلاع على شركتك فقط.');
    const rows=(co.length?co:visCos()).map(c=>{const x=expectedReport(c.id);return c.ar+': '+(x?x.status:'لا تقرير لفترة '+previousPeriod(S.date))+(x&&x.status==='معاد للتعديل'&&x.note?' — '+x.note:'')});
    return{html:br(rows.join('\n')),src:['التقارير الشهرية · فترة '+previousPeriod(S.date)]}}
  if(finance&&/ايراد|مصروف|رصيد|مستحقات|ربح|دخل|اداء|وضع/.test(q)){
    if(!canFin())return refuse('الأرقام المالية غير متاحة لدورك.');
    let targets=co.length?co:visCos();
    if(r==='manager'&&co.length&&co.some(c=>c.id!==companyForRole()))return refuse('تستطيع الاطلاع على شركتك فقط.');
    const rows=targets.map(c=>{const x=approvedReports(c.id)[0];return x?c.ar+': إيراد '+fmt(x.revenue,c.id)+'، مصروفات '+fmt(x.expenses,c.id)+'، صافي '+fmt((x.revenue||0)-(x.expenses||0),c.id)+' (فترة '+x.period+'، المصدر '+x.id+')':c.ar+': لا يوجد تقرير معتمد.'});
    return{html:br(rows.join('\n')+'\nالأرقام من التقارير المعتمدة فقط، بعملة كل شركة بلا تحويل.'),src:['التقارير المعتمدة']}}
  if(/فرص|استثمار/.test(q)){
    if(!['owner','bd'].includes(r))return refuse('الفرص الاستثمارية متاحة للمالك ومطور الأعمال.');
    return{html:br(S.opportunities.map(x=>x.id+' · '+x.title+' · '+cName(x.company)+' · '+workStatus(x.status)).join('\n')||'لا فرص مسجلة.'),src:['الفرص الاستثمارية']}}
  if(/عميل|عملاء/.test(q)){
    if(!['owner','marketing','manager'].includes(r))return refuse('العملاء المحتملون غير متاحين لدورك.');
    const ls=S.leads.filter(l=>r!=='manager'||l.company===companyForRole());
    return{html:br(ls.map(l=>l.id+' · '+l.name+' · '+cName(l.company)+' · '+l.status).join('\n')||'لا عملاء.'),src:['العملاء المحتملون']}}
  if(/اجاز/.test(q)){
    if(!['bd','manager'].includes(r))return refuse('الإجازات تُعرض لمدير الشركة ومطور الأعمال فقط.');
    const hs=S.hr.filter(h=>h.type.includes('إجازة')&&(r==='bd'||h.company===companyForRole()));
    return{html:br(hs.map(h=>h.id+' · '+h.type+' · '+h.status).join('\n')||'لا إجازات.'),src:['الموارد البشرية']}}
  const e=kbBest(q);if(e)return kbReply(e);
  return{html:'لم أجد جوابًا مؤكدًا في دليل سير العمل أو في بياناتك. إن كان عندك الجواب الصحيح فاضغط «اقتراح تصحيح» ليراجعه المالك، وإن اعتمده أتعلمه.',src:['لا مصدر مؤكد'],unknown:true}}

function ask(raw){
  const text=String(raw||'').trim();if(!text||!AI_ON())return;
  const a=ai(),k=chatKey(),ch=a.chats[k]=a.chats[k]||[];
  const res=answer(text);a.seq++;
  ch.push({t:'u',text});ch.push({t:'a',id:'M'+a.seq,html:res.html,src:res.src,q:text});
  if(ch.length>40)ch.splice(0,ch.length-40);
  a.usage[role()]=(a.usage[role()]||0)+1;
  auditLog('استخدام المساعد','AI','—','سؤال (النص غير مسجّل)');
  a.focus=true;persist();render()}

/* ===== البطاقة اليومية: نصيحة + جملة إيجابية من بيانات المستخدم فقط ===== */
function reviewHints(x){
  const h=[],p=priorReport(x),c=companyInfo(x.co);

  const tb=tb0;
  return `<div class="pagehead"><div><h1>إدارة الموقع</h1><p class="sub">${bd?'تدير هنا محتوى الموقع المنشور: الشركات والفرص. أي تغيير يُسجَّل في سجل التدقيق.':'عرض للقراءة؛ تدير المحتوى جهة مطور الأعمال.'}</p></div></div>${warn}${infoForm}<h2>شركات المجموعة على الموقع</h2>${tb(['الرقم','الشركة','الوصف','الاكتمال','النشر','الإجراء'],prow)}${pform}<h2>الفرص الواردة من الموقع</h2>${tb(['الرقم','الفرصة','القطاع والدولة','السعر','صاحب الطلب','الحالة','الإجراء'],srow)}<h2>اهتمامات الزوار بالفرص المنشورة</h2><p class="muted">لا يُنشر رقم صاحب الفرصة؛ يضغط الزائر «أبدِ اهتمامك» فيصل طلبه هنا إلى الإدارة.</p>${itable}${preview}`};
document.addEventListener('submit',e=>{

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||role()!=='bd')return;

  const P=()=>s.profiles.find(z=>z.id===arg),U=()=>s.subs.find(z=>z.id===arg);
  switch(act){
    case'siteEdit':S.siteEdit=arg;persist();render();break;
    case'siteEditCancel':S.siteEdit=null;persist();render();break;

    case'intSim':{const o=U();if(!o||o.status!=='منشور')break;const n=nextId('INT-TEST-',s.interests);s.interests.unshift({id:n,subId:o.id,name:'TEST - زائر '+n.slice(-3),phone:'+973 TEST '+n.slice(-3),email:'visitor'+n.slice(-3)+'@example.test',message:'أرغب بالتواصل بخصوص هذه الفرصة.',date:S.date,status:'جديد'});persist();render();break}
    case'intDone':{const x=s.interests.find(z=>z.id===arg);if(!x||x.status!=='جديد')break;x.status='تم التواصل';auditLog('معالجة اهتمام زائر بفرصة',x.id,'جديد','تم التواصل');persist();render();break}
    case'intClose':{const x=s.interests.find(z=>z.id===arg);if(!x||x.status==='مغلق')break;const old=x.status;x.status='مغلق';auditLog('إغلاق اهتمام زائر',x.id,old,'مغلق');persist();render();break}
    case'subUnpub':{const x=U();if(!x||x.status!=='منشور')break;x.status='جديد';auditLog('إلغاء نشر فرصة',x.id,'منشور','جديد');persist();render();break}
  }},true);
