&lt;div class=&quot;intro&quot;&gt;&lt;h1&gt;من نحن&lt;/h1&gt;&lt;p&gt;شركة ستارت أب سفير القابضة ذ.م.م، مقرها مملكة البحرين، تمتلك محفظة من الشركات والاستثمارات في قطاعات متعددة، وتعمل على تطوير شركات المجموعة وتنمية محفظتها.&lt;/p&gt;&lt;/div&gt;
&lt;section class=&quot;row&quot;&gt;&lt;h2&gt;دورنا داخل المجموعة&lt;/h2&gt;&lt;div&gt;&lt;p&gt;ندعم شركات المجموعة من خلال تطوير الأعمال والتسويق والمتابعة المالية والاستراتيجية، ونعمل معها على تحسين الأداء وتحديد فرص النمو. وتتولى كل شركة إدارة أعمالها اليومية وتقديم منتجاتها وخدماتها ضمن تخصصها.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;row&quot;&gt;&lt;h2&gt;محفظتنا الحالية&lt;/h2&gt;&lt;div&gt;&lt;p&gt;تشمل أعمال شركات المجموعة خدمات الأعمال ودعم المستثمرين، والمحاماة والاستشارات القانونية، والاستشارات الإدارية، والتجارة والتوزيع والتجارة الإلكترونية، والدعاية والإعلان، والمقاولات، والاتصالات والتقنية.&lt;/p&gt;&lt;p&gt;وتعكس هذه الأنشطة محفظتنا الحالية، مع انفتاحنا على قطاعات وأسواق جديدة تتناسب مع فرص النمو وتوجه المجموعة.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;row&quot;&gt;&lt;h2&gt;كيف ننمو&lt;/h2&gt;&lt;div&gt;&lt;p&gt;ننطلق من تطوير الشركات الحالية، وإعادة استثمار رأس المال حيث تتوافر فرص مناسبة. وندرس فرص الاستثمار في شركات قائمة، والاستحواذ، والشراكات، وتأسيس أعمال جديدة، والتوسع بالنماذج الناجحة إلى أسواق أخرى.&lt;/p&gt;&lt;p&gt;ويشمل تطوير المحفظة مراجعة الاستثمارات وإمكانية التخارج منها، بما يخدم توجه المجموعة على المدى الطويل.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;intro&quot;&gt;&lt;h1&gt;الفرص التجارية&lt;/h1&gt;&lt;p&gt;استكشف مشاريع قائمة معروضة للبيع في دول الخليج، أو قدّم مشروعك للمراجعة والنشر.&lt;/p&gt;&lt;a class=&quot;action&quot; href=&quot;#so-submit&quot;&gt;اعرض مشروعك&lt;/a&gt;&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;استكشف الفرص&lt;/h2&gt;&lt;p&gt;تصفّح الفرص حسب الدولة أو النشاط، واطّلع على تفاصيل المشروع وتواصل مباشرة مع البائع.&lt;/p&gt;&lt;div class=&quot;filters&quot;&gt;&lt;label&gt;الدولة&lt;select disabled&gt;&lt;option&gt;جميع الدول&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;النشاط / القطاع&lt;select disabled&gt;&lt;option&gt;جميع الأنشطة&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;grid&quot; id=&quot;so-cards&quot;&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;so-submit&quot;&gt;&lt;h2&gt;اعرض مشروعك&lt;/h2&gt;&lt;p&gt;أرسل بيانات مشروعك لعرضه للبيع في دول الخليج، بعد المراجعة والموافقة.&lt;/p&gt;
&lt;fieldset class=&quot;group&quot;&gt;&lt;legend&gt;بيانات مقدم الطلب&lt;/legend&gt;&lt;div class=&quot;fields&quot;&gt;&lt;label&gt;الاسم الكامل*&lt;input disabled&gt;&lt;/label&gt;&lt;label&gt;رقم الهاتف / واتساب*&lt;input disabled&gt;&lt;small&gt;سيظهر للمهتمين للتواصل معك مباشرة عند نشر الإعلان.&lt;/small&gt;&lt;/label&gt;&lt;label&gt;البريد الإلكتروني&lt;input disabled&gt;&lt;small&gt;للتواصل الإداري فقط، ولا يظهر في الإعلان.&lt;/small&gt;&lt;/label&gt;&lt;label&gt;مستند يثبت علاقتك بالمشروع*&lt;input type=&quot;file&quot; disabled&gt;&lt;small&gt;مثل السجل التجاري أو مستند الملكية أو التفويض. للمراجعة الداخلية فقط ولن يُنشر.&lt;/small&gt;&lt;/label&gt;&lt;/div&gt;&lt;/fieldset&gt;
&lt;fieldset class=&quot;group&quot;&gt;&lt;legend&gt;بيانات المشروع&lt;/legend&gt;&lt;div class=&quot;fields&quot;&gt;&lt;label&gt;اسم المشروع&lt;input disabled&gt;&lt;/label&gt;&lt;label&gt;هل ترغب في إظهار اسم المشروع في الإعلان؟&lt;select disabled&gt;&lt;option&gt;نعم / لا&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;نوع النشاط / القطاع*&lt;select disabled&gt;&lt;option&gt;اختر النشاط&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;الدولة*&lt;select disabled&gt;&lt;option&gt;اختر الدولة&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;المدينة*&lt;input disabled&gt;&lt;/label&gt;&lt;label&gt;المنطقة&lt;input disabled&gt;&lt;/label&gt;&lt;label&gt;سنة التأسيس*&lt;input disabled&gt;&lt;/label&gt;&lt;label&gt;السعر المطلوب*&lt;input disabled&gt;&lt;/label&gt;&lt;label&gt;العملة*&lt;select disabled&gt;&lt;option&gt;اختر العملة&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;سبب البيع*&lt;input disabled&gt;&lt;/label&gt;&lt;label&gt;متوسط المبيعات الشهرية*&lt;input disabled&gt;&lt;/label&gt;&lt;label&gt;متوسط صافي الربح الشهري&lt;input disabled&gt;&lt;/label&gt;&lt;label&gt;عدد الموظفين&lt;input disabled&gt;&lt;/label&gt;&lt;label&gt;ماذا يشمل سعر البيع؟&lt;input disabled&gt;&lt;/label&gt;&lt;label class=&quot;full&quot;&gt;وصف المشروع*&lt;textarea rows=&quot;4&quot; disabled&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label class=&quot;full&quot;&gt;صور المشروع — اختياري&lt;input type=&quot;file&quot; accept=&quot;image/*&quot; multiple disabled&gt;&lt;small&gt;يمكنك إرفاق عدة صور، أو إرسال الطلب دون صور.&lt;/small&gt;&lt;/label&gt;&lt;/div&gt;&lt;/fieldset&gt;&lt;p&gt;&lt;small&gt;* الحقول المطلوبة&lt;/small&gt;&lt;/p&gt;&lt;span class=&quot;action&quot;&gt;إرسال المشروع للمراجعة&lt;/span&gt;&lt;/section&gt;

&lt;main class=&quot;main&quot;&gt;&lt;div&gt;&lt;div class=&quot;gallery&quot;&gt;&lt;div class=&quot;large-image&quot; aria-live=&quot;polite&quot;&gt;صورة المشروع — 1&lt;/div&gt;&lt;div class=&quot;thumbnails&quot; aria-label=&quot;صور المشروع&quot;&gt;&lt;button type=&quot;button&quot; data-photo=&quot;1&quot; aria-pressed=&quot;true&quot;&gt;صورة 1&lt;/button&gt;&lt;button type=&quot;button&quot; data-photo=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;صورة 2&lt;/button&gt;&lt;button type=&quot;button&quot; data-photo=&quot;3&quot; aria-pressed=&quot;false&quot;&gt;صورة 3&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;عن المشروع&lt;/h2&gt;&lt;p&gt;وصف المشروع كما تحرره الإدارة بعد مراجعة البيانات المقدمة.&lt;/p&gt;&lt;div class=&quot;facts&quot;&gt;&lt;div&gt;سنة التأسيس&lt;p&gt;—&lt;/p&gt;&lt;/div&gt;&lt;div&gt;عدد الموظفين&lt;p&gt;—&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;البيانات المالية&lt;/h2&gt;&lt;div class=&quot;facts&quot;&gt;&lt;div&gt;متوسط المبيعات الشهرية&lt;p&gt;—&lt;/p&gt;&lt;/div&gt;&lt;div&gt;متوسط صافي الربح الشهري&lt;p&gt;—&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;ما يشمله سعر البيع&lt;/h2&gt;&lt;p&gt;—&lt;/p&gt;&lt;h2&gt;سبب البيع&lt;/h2&gt;&lt;p&gt;—&lt;/p&gt;&lt;p&gt;تاريخ النشر: —&lt;/p&gt;&lt;/div&gt;&lt;aside class=&quot;contact&quot;&gt;&lt;h2&gt;السعر المطلوب&lt;/h2&gt;&lt;p&gt;— العملة&lt;/p&gt;&lt;p&gt;الموقع: المدينة · الدولة&lt;/p&gt;&lt;p&gt;نوع النشاط: —&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;span class=&quot;action&quot;&gt;تواصل مع البائع&lt;/span&gt;&lt;/div&gt;&lt;p&gt;المعلومات مقدمة من صاحب المشروع، ونشرها لا يمثل ضمانًا أو توصية استثمارية من الإدارة.&lt;/p&gt;&lt;div class=&quot;actions&quot;&gt;&lt;span class=&quot;action&quot;&gt;مشاركة عبر واتساب&lt;/span&gt;&lt;span class=&quot;action&quot;&gt;نسخ الرابط&lt;/span&gt;&lt;/div&gt;&lt;/aside&gt;&lt;/main&gt;

&lt;section class=&quot;intro&quot;&gt;&lt;h1&gt;انضم إلى فريق ستارت أب سفير&lt;/h1&gt;&lt;p&gt;نبحث عن كفاءات طموحة تشاركنا بناء المرحلة القادمة من نمو ستارت أب سفير وشركات المجموعة.&lt;/p&gt;&lt;p&gt;أرسل سيرتك الذاتية للنظر فيها عند توفر فرصة مناسبة.&lt;/p&gt;&lt;/section&gt;

&lt;div class=&quot;intro&quot;&gt;&lt;h1&gt;الشروط والأحكام&lt;/h1&gt;&lt;/div&gt;
&lt;main class=&quot;legal-copy&quot;&gt;
&lt;section&gt;&lt;h2&gt;عن الموقع&lt;/h2&gt;&lt;p&gt;هذا الموقع تابع لشركة ستارت أب سفير القابضة ذ.م.م، ويعرّف بالقابضة وشركات المجموعة، ويستقبل طلبات الخدمات والتوظيف، ويتيح عرض المشاريع المعروضة للبيع.&lt;/p&gt;&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;طلبات الخدمات&lt;/h2&gt;&lt;p&gt;تستقبل القابضة الطلبات وتوجّهها إلى الجهة المختصة ضمن شركات المجموعة. وتتولى الجهة المقدمة للخدمة تحديد نطاق العمل والأتعاب وشروط التعاقد مع العميل.&lt;/p&gt;&lt;p&gt;إرسال الطلب لا يُعد قبولًا لتنفيذ الخدمة أو إبرامًا لعقد.&lt;/p&gt;&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;طلبات التوظيف&lt;/h2&gt;&lt;p&gt;تقديم السيرة الذاتية لا يُعد عرضًا وظيفيًا أو ضمانًا لإجراء مقابلة أو التوظيف.&lt;/p&gt;&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;عرض المشاريع&lt;/h2&gt;&lt;p&gt;يلتزم مقدم الطلب بصحة المعلومات والمستندات المقدمة، وأن يكون مالكًا للمشروع أو مخوّلًا بعرضه، وله صلاحية تقديم المواد والصور للنشر.&lt;/p&gt;&lt;p&gt;تخضع الطلبات للمراجعة، وللإدارة قبول الإعلان أو رفضه، وتحرير صياغته دون تغيير جوهر المعلومات، وإزالته عند عدم توافره أو مخالفة شروط النشر.&lt;/p&gt;&lt;p&gt;يلتزم مقدم الإعلان بإبلاغ الإدارة عند بيع المشروع أو سحبه من العرض، أو حدوث تغيير جوهري في بياناته.&lt;/p&gt;&lt;p&gt;المعلومات مقدمة من صاحب المشروع، ونشرها لا يمثل ضمانًا أو توصية استثمارية من الإدارة.&lt;/p&gt;&lt;p&gt;يتواصل المهتم مباشرة مع البائع، ويتولى الطرفان التحقق والتفاوض والاتفاق على شروط الصفقة. ولا تصبح القابضة طرفًا في الصفقة بمجرد نشر الإعلان.&lt;/p&gt;&lt;p&gt;أي مساعدة متخصصة تُطلب من شركات المجموعة تخضع لاتفاق مستقل مع الجهة المقدمة لها.&lt;/p&gt;&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;استخدام الموقع&lt;/h2&gt;&lt;p&gt;يُمنع تقديم طلبات أو إعلانات مضللة، أو رفع مواد دون صلاحية، أو إساءة استخدام النماذج، أو محاولة تعطيل الموقع أو الوصول غير المصرح به إلى بياناته.&lt;/p&gt;&lt;/section&gt;
&lt;section&gt;&lt;h2&gt;الروابط الخارجية&lt;/h2&gt;&lt;p&gt;قد يتضمن الموقع روابط لمواقع شركات المجموعة وخدمات خارجية. ويخضع استخدام هذه المواقع والخدمات لشروطها وسياسات الخصوصية الخاصة بها.&lt;/p&gt;&lt;/section&gt;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true

      }

      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);

  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");

    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });

    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],

    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
