# Safir Holding 2027 — shared security headers (nginx snippet).
#
# Install alongside the site config:
#   sudo cp deploy/nginx/safir-security-headers.conf \
#       /etc/nginx/snippets/safir-security-headers.conf
#
# Included at server level *and* inside any location that sets its own
# ``add_header`` (e.g. a Cache-Control for static assets). nginx does not merge
# ``add_header`` across levels: a location that declares one replaces the whole
# inherited set, so without this include the HSTS/CSP/nosniff/frame/referrer
# headers would silently vanish from that location's responses.

# HSTS: start with a modest max-age while validating, then raise it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# CSP: the approved dashboard ships one inline <script> block and inline style
# attributes, and loads Google Fonts, so 'unsafe-inline' and the two font hosts
# are required. connect-src is 'self' because the frontend talks to the same
# origin. frame-ancestors reinforces X-Frame-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
