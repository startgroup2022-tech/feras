# Safir Holding 2027 — staging reverse proxy (nginx).
#
# Install to /etc/nginx/sites-available/safir-staging and symlink into
# sites-enabled. Replace staging.example.com with the real staging domain and
# obtain a certificate (e.g. certbot) before first start.
#
#   sudo ln -s /etc/nginx/sites-available/safir-staging \
#       /etc/nginx/sites-enabled/safir-staging
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app listens on 127.0.0.1:8000 only; all public traffic goes through here.

# Shared upstream (http context, provided by the sites-enabled include).
upstream safir_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Redirect all plaintext traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.example.com;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- security headers ----
    # Defined once in a snippet so they can be re-included inside any location
    # that sets its own ``add_header`` (nginx replaces, never merges, the
    # inherited set).
    include snippets/safir-security-headers.conf;

    # Attachment uploads are capped at 10 MiB in the app; allow a little slack.
    client_max_body_size 12m;

    # ---- compression ----
    # ``app.js`` is ~550 KB uncompressed and ~116 KB gzipped, so this is the
    # single largest frontend win. HTML and JSON compress well too; images and
    # PDFs are already compressed and are excluded.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- Swagger / OpenAPI: authorized users only ----
    # The app disables docs when APP_ENV=production. For staging (APP_ENV=staging)
    # they are reachable, so gate them here. Two options:
    #
    # (a) HTTP basic auth (create the file with: htpasswd -c /etc/nginx/.htpasswd <user>)
    # location = /api/docs {
    #     auth_basic "Safir staging docs";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://safir_backend;
    #     include /etc/nginx/proxy_params_safir;
    # }
    # location = /api/openapi.json {
    #     auth_basic "Safir staging docs";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://safir_backend;
    #     include /etc/nginx/proxy_params_safir;
    # }
    #
    # (b) Restrict by source IP (VPN / office range):
    # location ~ ^/api/(docs|openapi\.json)$ {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://safir_backend;
    #     include /etc/nginx/proxy_params_safir;
    # }
    #
    # The block below is the default-deny fallback when neither option is used:
    location ~ ^/api/(docs|openapi\.json)$ {
        deny all;
    }

    # ---- application ----
    location / {
        proxy_pass http://safir_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- public website static assets ----
    # Long-cached because the filenames are stable; bump the query string on
    # deploy if a change must be picked up immediately.
    location /website/assets/ {
        proxy_pass http://safir_backend;
        proxy_set_header Host $host;
        expires 7d;
        # Re-include the security headers: this block's add_header would
        # otherwise drop the server-level set for these responses.
        include snippets/safir-security-headers.conf;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ---- internal platform ----
    # The platform is served by the app under /platform with X-Robots-Tag:
    # noindex. It is not part of the public marketing site.

    # Platform static assets are cacheable, but *not* immutable: the filenames
    # are stable (``app.js``, ``styles.css``) with no content hash, so a deploy
    # changes the bytes behind the same URL. A short max-age avoids serving a
    # stale shell; the backend's ETag/Last-Modified drive revalidation after it.
    #
    # Only ``expires`` is used here, never ``add_header``: an ``add_header`` at
    # this level would suppress the server-level security headers (HSTS, CSP,
    # nosniff, frame/referrer policy) for these responses.
    location ~ ^/platform/(app|auth)\.js$|^/platform/styles\.css$ {
        proxy_pass http://safir_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        expires 5m;
    }

    location /platform {
        proxy_pass http://safir_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
