# Safir Holding 2027 — staging reverse proxy (nginx).
#
# Install to /etc/nginx/sites-available/safir-staging and symlink into
# sites-enabled. Replace staging.example.com with the real staging domain and
# obtain a certificate (e.g. certbot) before first start.
#
#   sudo ln -s /etc/nginx/sites-available/safir-staging \
#       /etc/nginx/sites-enabled/safir-staging
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app listens on 127.0.0.1:8000 only; all public traffic goes through here.

# Shared upstream (http context, provided by the sites-enabled include).
upstream safir_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Redirect all plaintext traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.example.com;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- security headers ----
    # HSTS: start with a modest max-age while validating, then raise it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: the approved dashboard ships one inline <script> block and inline
    # style attributes, and loads Google Fonts, so 'unsafe-inline' and the two
    # font hosts are required. connect-src is 'self' because the frontend talks
    # to the same origin. frame-ancestors reinforces X-Frame-Options.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Attachment uploads are capped at 10 MiB in the app; allow a little slack.
    client_max_body_size 12m;

    # ---- Swagger / OpenAPI: authorized users only ----
    # The app disables docs when APP_ENV=production. For staging (APP_ENV=staging)
    # they are reachable, so gate them here. Two options:
    #
    # (a) HTTP basic auth (create the file with: htpasswd -c /etc/nginx/.htpasswd <user>)
    # location = /api/docs {
    #     auth_basic "Safir staging docs";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://safir_backend;
    #     include /etc/nginx/proxy_params_safir;
    # }
    # location = /api/openapi.json {
    #     auth_basic "Safir staging docs";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://safir_backend;
    #     include /etc/nginx/proxy_params_safir;
    # }
    #
    # (b) Restrict by source IP (VPN / office range):
    # location ~ ^/api/(docs|openapi\.json)$ {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     proxy_pass http://safir_backend;
    #     include /etc/nginx/proxy_params_safir;
    # }
    #
    # The block below is the default-deny fallback when neither option is used:
    location ~ ^/api/(docs|openapi\.json)$ {
        deny all;
    }

    # ---- application ----
    location / {
        proxy_pass http://safir_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
